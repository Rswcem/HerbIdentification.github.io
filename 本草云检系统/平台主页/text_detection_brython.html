<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字检测 - 本草云检 (Brython版)</title>
    <!-- Brython - 在浏览器中运行 Python -->
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
    <link href="./tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Homepage.css">
    <style>
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 12px;
            flex-shrink: 0;
        }
        .message.user .message-avatar {
            background: #514036;
            color: white;
        }
        .message.bot .message-avatar {
            background: #796155;
            color: white;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: #514036;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            border-radius: 0 0 16px 16px;
        }
        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
            resize: none;
            min-height: 24px;
            max-height: 120px;
        }
        .chat-input:focus {
            border-color: #514036;
        }
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: #514036;
            color: white;
        }
        .send-btn:hover {
            background: #796155;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #796155;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .page-header {
            background: linear-gradient(135deg, #514036 0%, #796155 100%);
            color: white;
            padding: 40px 0;
            text-align: center;
        }
        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .main-content {
            padding: 40px 20px;
            background: #f0f2f5;
            min-height: calc(100vh - 200px);
        }
        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding: 0 20px;
        }
        .chip {
            background: white;
            border: 1px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        .chip:hover {
            background: #514036;
            color: white;
            border-color: #514036;
        }
        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body onload="brython()">
    <!-- 导航栏 -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="Homepage.html" class="flex items-center">
                <img src="../images/logo.png" alt="本草云检 logo" class="h-8 md:h-10 mr-2">
                <span class="text-xl md:text-2xl font-bold text-primary">本草云检</span>
            </a>
            <div class="hidden md:flex space-x-6 items-center">
                <a href="Homepage.html" class="text-gray-600 hover:text-primary-green">返回首页</a>
            </div>
        </div>
    </nav>

    <!-- 页面头部 -->
    <div class="page-header" style="margin-top: 72px;">
        <h1><i class="fas fa-file-alt mr-2"></i>文字检测 (Brython版)</h1>
        <p>描述中药材特征，AI智能识别药材种类与功效</p>
    </div>

    <!-- 警告信息 -->
    <div class="warning-box">
        <i class="fas fa-exclamation-triangle mr-2"></i>
        <strong>注意：</strong>Brython 版本有局限性，无法加载 PyTorch 等复杂库。建议使用 Flask 服务器版本。
        <br>此演示仅展示 Brython 的基本用法。
    </div>

    <!-- 主要内容 -->
    <div class="main-content">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">
                        您好！这是 Brython 演示版本。由于浏览器限制，无法直接运行 herb_api.py 中的 PyTorch 模型。
                        <br><br>
                        请点击下方建议，查看模拟响应。
                    </div>
                </div>
            </div>
            <div class="suggestion-chips" id="suggestionChips">
                <div class="chip" onclick="setInput('红色根茎，味道辛辣')">红色根茎，味道辛辣</div>
                <div class="chip" onclick="setInput('椭圆形叶子，有清香')">椭圆形叶子，有清香</div>
                <div class="chip" onclick="setInput('可以补气养血的药材')">可以补气养血的药材</div>
                <div class="chip" onclick="setInput('治疗感冒咳嗽的草药')">治疗感冒咳嗽的草药</div>
            </div>
            <div class="chat-input-area">
                <div class="input-container">
                    <textarea class="chat-input" id="messageInput" placeholder="请描述中药材的特征、功效或外观..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Brython Python 代码 -->
    <script type="text/python">
from browser import document, window, html
import json

# 模拟药材知识库（实际应该从 herb_api.py 加载）
HERB_KNOWLEDGE = {
    "人参": {
        "description": "多年生草本，高30-60厘米，根状茎肥厚呈拳状",
        "功效": "大补元气，复脉固脱，补脾益肺，生津养血，安神益智",
        "特征": "主根呈圆柱形或纺锤形，表面灰黄色"
    },
    "枸杞": {
        "description": "灌木，多分枝，枝条细长，常弯曲下垂",
        "功效": "滋补肝肾，益精明目",
        "特征": "果实呈类纺锤形或椭圆形，表面鲜红色或暗红色"
    },
    "当归": {
        "description": "多年生草本，高0.4-1米，根圆柱状，分枝，黄棕色",
        "功效": "补血活血，调经止痛，润肠通便",
        "特征": "根呈圆柱形，表面黄棕色或棕褐色"
    },
    "黄芪": {
        "description": "多年生草本，高50-100厘米，主根肥厚，木质",
        "功效": "补气升阳，固表止汗，利水消肿，生津养血",
        "特征": "根呈圆柱形，表面淡棕黄色或淡棕褐色"
    }
}

def add_message(content, is_user=False):
    """添加消息到聊天窗口"""
    chat_messages = document['chatMessages']
    message_div = html.DIV(Class=f"message {'user' if is_user else 'bot'}")

    avatar = html.DIV(Class="message-avatar")
    icon = html.I(Class=f"fas {'fa-user' if is_user else 'fa-robot'}")
    avatar <= icon

    content_div = html.DIV(content, Class="message-content")

    message_div <= avatar
    message_div <= content_div
    chat_messages <= message_div

    # 滚动到底部
    chat_messages.scrollTop = chat_messages.scrollHeight

def show_typing():
    """显示输入中动画"""
    chat_messages = document['chatMessages']
    typing_div = html.DIV(Class="message bot typing", Id="typingIndicator")

    avatar = html.DIV(Class="message-avatar")
    avatar <= html.I(Class="fas fa-robot")

    content_div = html.DIV(Class="message-content")
    indicator = html.DIV(Class="typing-indicator")
    for _ in range(3):
        indicator <= html.SPAN()
    content_div <= indicator

    typing_div <= avatar
    typing_div <= content_div
    chat_messages <= typing_div
    chat_messages.scrollTop = chat_messages.scrollHeight

def hide_typing():
    """隐藏输入中动画"""
    typing = document.getElementById('typingIndicator')
    if typing:
        typing.remove()

def simple_recognize(text):
    """简单的关键词匹配（模拟 herb_api.py 功能）"""
    text = text.lower()

    # 关键词匹配
    keywords = {
        "红色": ["枸杞", "红枣", "丹参"],
        "根茎": ["人参", "当归", "黄芪", "甘草"],
        "辛辣": ["生姜", "大蒜", "辣椒"],
        "补气": ["人参", "黄芪", "党参"],
        "养血": ["当归", "熟地", "阿胶"],
        "明目": ["枸杞", "菊花", "决明子"],
        "感冒": ["金银花", "连翘", "板蓝根"],
        "咳嗽": ["川贝", "杏仁", "枇杷叶"]
    }

    matched_herbs = []
    for keyword, herbs in keywords.items():
        if keyword in text:
            matched_herbs.extend(herbs)

    if matched_herbs:
        from collections import Counter
        most_common = Counter(matched_herbs).most_common(1)[0][0]

        if most_common in HERB_KNOWLEDGE:
            herb = HERB_KNOWLEDGE[most_common]
            return f"根据您的描述，这听起来像是**{most_common}**。\n\n{herb['description']}\n\n主要功效：{herb['功效']}\n\n识别特征：{herb['特征']}"
        else:
            return f"根据您的描述，可能是**{most_common}**。建议上传图片进行更准确的识别。"

    return "请提供更多描述信息，如颜色、形状、气味、功效等，以便我更准确地识别。"

def send_message(event):
    """发送消息"""
    input_elem = document['messageInput']
    text = input_elem.value.strip()

    if not text:
        window.alert('请输入描述内容')
        return

    # 显示用户消息
    add_message(text, is_user=True)

    # 清空输入
    input_elem.value = ''

    # 显示输入中
    show_typing()

    # 模拟处理延迟
    def process_response():
        hide_typing()
        response = simple_recognize(text)
        add_message(response)

    window.setTimeout(process_response, 1000)

def set_input(text):
    """设置输入内容"""
    document['messageInput'].value = text

# 绑定事件
document['sendBtn'].bind('click', send_message)

# 回车发送
def on_keypress(event):
    if event.key == 'Enter' and not event.shiftKey:
        event.preventDefault()
        send_message(event)

document['messageInput'].bind('keypress', on_keypress)

# 导出到全局，供HTML调用
window.setInput = set_input
    </script>
</body>
</html>
