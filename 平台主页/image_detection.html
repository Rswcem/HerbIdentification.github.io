<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像检测 - 本草云检</title>
    <link href="./tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Homepage.css">
    <style>
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 12px;
            flex-shrink: 0;
        }
        .message.user .message-avatar {
            background: #514036;
            color: white;
        }
        .message.bot .message-avatar {
            background: #796155;
            color: white;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: #514036;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            border-radius: 0 0 16px 16px;
        }
        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
            resize: none;
            min-height: 24px;
            max-height: 120px;
        }
        .chat-input:focus {
            border-color: #514036;
        }
        .upload-btn, .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .upload-btn {
            background: #f0f0f0;
            color: #514036;
        }
        .upload-btn:hover {
            background: #e0e0e0;
        }
        .send-btn {
            background: #514036;
            color: white;
        }
        .send-btn:hover {
            background: #796155;
        }
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .preview-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-item .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #796155;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        .page-header {
            background: linear-gradient(135deg, #514036 0%, #796155 100%);
            color: white;
            padding: 40px 0;
            text-align: center;
        }
        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .page-header p {
            opacity: 0.9;
        }
        .main-content {
            padding: 40px 20px;
            background: #f0f2f5;
            min-height: calc(100vh - 200px);
        }
        .required-notice {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="../index.html" class="flex items-center">
                <img src="../images/logo.png" alt="本草云检 logo" class="h-8 md:h-10 mr-2">
                <span class="text-xl md:text-2xl font-bold text-primary">本草云检</span>
            </a>
            <div class="hidden md:flex space-x-6 items-center">
                <a href="../index.html" class="text-gray-600 hover:text-primary-green">返回首页</a>
            </div>
        </div>
    </nav>

    <!-- 页面头部 -->
    <div class="page-header" style="margin-top: 72px;">
        <h1><i class="fas fa-image mr-2"></i>图像检测</h1>
        <p>上传中药材图片，AI智能识别药材种类与特征</p>
    </div>

    <!-- 主要内容 -->
    <div class="main-content">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">
                        您好！我是您的中药材图像识别助手。请上传中药材图片，我将帮您识别药材种类并分析其特征。
                    </div>
                </div>
            </div>
            <div class="chat-input-area">
                <div class="required-notice">
                    <i class="fas fa-info-circle mr-2"></i>图像检测必须上传图片文件
                </div>
                <div class="preview-container" id="previewContainer"></div>
                <div class="input-container">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="上传图片">
                        <i class="fas fa-image"></i>
                    </button>
                    <textarea class="chat-input" id="messageInput" placeholder="上传图片后，可以输入补充描述（可选）..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API 基础地址 - 根据实际部署修改
        const API_BASE_URL = 'http://localhost:8000';

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const sendBtn = document.getElementById('sendBtn');
        let uploadedFiles = [];

        // 自动调整输入框高度
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 文件选择处理
        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    uploadedFiles.push(file);
                    showPreview(file);
                }
            });
            updateSendButton();
        });

        // 显示预览
        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `
                    <img src="${e.target.result}" alt="preview">
                    <button class="remove-btn" onclick="removeFile('${file.name}')">×</button>
                `;
                previewContainer.appendChild(div);
            };
            reader.readAsDataURL(file);
        }

        // 移除文件
        function removeFile(fileName) {
            uploadedFiles = uploadedFiles.filter(f => f.name !== fileName);
            previewContainer.innerHTML = '';
            uploadedFiles.forEach(showPreview);
            updateSendButton();
        }

        // 更新发送按钮状态
        function updateSendButton() {
            sendBtn.disabled = uploadedFiles.length === 0;
        }

        // 添加消息到聊天
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">
                    <i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i>
                </div>
                <div class="message-content">${content}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 显示输入中动画
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot typing';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 隐藏输入中动画
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // 固定回复计数器
        let replyCounter = 0;

        // 发送消息（固定回复模式）
        function sendMessage() {
            const text = messageInput.value.trim();

            if (uploadedFiles.length === 0) {
                alert('请先上传图片文件');
                return;
            }

            // 显示用户消息
            let userContent = '';
            if (uploadedFiles.length > 0) {
                userContent += `<div style="margin-bottom: 8px;"><i class="fas fa-image"></i> 已上传 ${uploadedFiles.length} 张图片</div>`;
            }
            if (text) {
                userContent += text;
            }
            addMessage(userContent, true);

            // 清空输入
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // 显示输入中
            showTyping();

            // 加载a.json并显示固定回复
            fetch('./a.json')
                .then(response => response.json())
                .then(data => {
                    // 循环使用text数组中的回复
                    const replies = data.image;
                    const currentIndex = replyCounter % replies.length;
                    const replyText = replies[currentIndex];
                    
                    // 更新计数器
                    replyCounter++;
                    
                    // 等待5秒后显示回复
                    setTimeout(() => {
                        hideTyping();
                        addMessage(replyText);
                        
                        // 清空已上传文件
                        uploadedFiles = [];
                        previewContainer.innerHTML = '';
                        updateSendButton();
                    }, 5000);
                })
                .catch(error => {
                    hideTyping();
                    addMessage('抱歉，加载预设回复失败，请检查a.json文件。');
                    console.error('Error loading a.json:', error);
                });
        }

        // 回车发送
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
