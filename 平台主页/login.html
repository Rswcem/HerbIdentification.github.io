<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login - 本草云检</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
<div class="logo">
    <div class="top-logo">
        <img src="../images/logo.png" alt="本草云检 logo" class="logo-image">
        <span class="logo-title">本草云检</span>
    </div>
</div>
    <div class="login-container">
        <div class="contanin-box">
            <div class="box-left"></div>
            <div class="box-right">
                <div class="form-title">
                    <span class="form-title-main">登录系统</span>
                    <span class="form-title-sub">欢迎登录本草云检系统</span>
                </div>
                <form class="form-wrap">
                    <div class="form-item">
                        <div class="form-item-title">用户名</div>
                        <input
                            class="form-item-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            id="email" type="email" placeholder="请输入手机号">
                    </div>
                    <div class="form-item">
                        <div class="form-item-title">密码</div>
                        <input
                            class="form-item-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
                            id="password" type="password" placeholder="请输入密码">
                    </div>
                    <div class="flex items-center justify-between">
                        <a href="../平台主页/Homepage.html" class="btn-primary " type="submit">登录</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
